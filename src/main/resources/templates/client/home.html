<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{client/layouts/default.html}">
<head>
    <link rel="stylesheet" th:href="@{/css/clientHome.css}">
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container-fluid">
        <div class="product">
            <h1 class="productTitle h3 mb-4">
                SẢN PHẨM <span>NỔI BẬT</span>
            </h1>
            <div class="row" style="width: 100%">
                <div class="col-2 productItem" th:each="book : ${books}">
                    <div class="image">
                        <img
                                width="100%"
                                th:src="${book.thumbnail}"
                        />
                    </div>
                    <div class="content">
                        <a th:href="@{/detail/{bookId}(bookId=${book.id})}" class="title" th:text="${book.name}"></a>
                        <span class="price" th:text="${book.price}"
                        ><span class="unitPrice"
                        >đ</span
                        ></span
                        >
                    </div>
                </div>
            </div>
            <nav th:if="${keyword == null}">
                <ul class="pagination">
                    <li th:classappend="${books.hasPrevious()} ? '' : 'disabled'" class="page-item">
                        <a th:href="@{/(page=${books.number - 1}, size=${books.size})}" class="page-link">Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, books.totalPages - 1)}"
                        th:classappend="${books.number == i} ? 'active'">
                        <a th:href="@{/(page=${i}, size=${books.size})}" class="page-link" th:text="${i + 1}">1</a>
                    </li>
                    <li th:classappend="${books.hasNext()} ? '' : 'disabled'" class="page-item">
                        <a th:href="@{/(page=${books.number + 1}, size=${books.size})}" class="page-link">Next</a>
                    </li>
                </ul>
            </nav>
            <nav th:if="${keyword != null}">
                <ul class="pagination">
                    <li th:classappend="${books.hasPrevious()} ? '' : 'disabled'" class="page-item">
                        <a th:href="@{/search(keyword=${keyword}, page=${books.number - 1}, size=${books.size})}" class="page-link">Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, books.totalPages - 1)}"
                        th:classappend="${books.number == i} ? 'active'">
                        <a th:href="@{/search(keyword=${keyword}, page=${i}, size=${books.size})}" class="page-link" th:text="${i + 1}">1</a>
                    </li>
                    <li th:classappend="${books.hasNext()} ? '' : 'disabled'" class="page-item">
                        <a th:href="@{/search(keyword=${keyword}, page=${books.number + 1}, size=${books.size})}" class="page-link">Next</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</div>
</body>
</html>
